<meta charset="utf-8">
<title>Panel Estaciones</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estaciones">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Tokens heredados del panel de escritorio (src/static/panel.html) */
  :root{
    --bg:#f6f5f1; --surf:#ffffff; --surf1:#f1efe8;
    --txt:#2c2c2a; --txt2:#5f5e5a; --txt3:#6a6964;
    --line:#e5e2d9; --acc:#378ADD; --acc-soft:rgba(55,138,221,.12);
    --ok:#3b6d11; --ok-bg:#eaf3de; --warn:#854f0b; --warn-bg:#faeeda;
    --bad:#a32d2d; --bad-bg:#fcebeb; --velo:rgba(30,30,28,.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1c1a; --surf:#26261f; --surf1:#2f2f28;
      --txt:#ececea; --txt2:#b4b2a9; --txt3:#a09e95;
      --line:#3a3a32; --acc:#5da3e8; --acc-soft:rgba(93,163,232,.16);
      --ok:#97c459; --ok-bg:#1e2c10; --warn:#efb45c; --warn-bg:#33260a;
      --bad:#f09595; --bad-bg:#2e1212; --velo:rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1c1a; --surf:#26261f; --surf1:#2f2f28;
    --txt:#ececea; --txt2:#b4b2a9; --txt3:#a09e95;
    --line:#3a3a32; --acc:#5da3e8; --acc-soft:rgba(93,163,232,.16);
    --ok:#97c459; --ok-bg:#1e2c10; --warn:#efb45c; --warn-bg:#33260a;
    --bad:#f09595; --bad-bg:#2e1212; --velo:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box; margin:0}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding-bottom:calc(52px + env(safe-area-inset-bottom));
  }
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  .wrap{max-width:560px; margin:0 auto; padding:12px 14px 24px; display:flex; flex-direction:column; gap:14px}

  /* ---- barra superior sticky ---- */
  .topbar{
    position:sticky; top:0; z-index:30; background:var(--bg);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:10px 12px;
  }
  .topbar .menu{width:40px; height:40px; border-radius:10px; background:var(--surf1);
    display:flex; align-items:center; justify-content:center; flex:none}
  .topbar .menu svg{width:20px; height:20px; stroke:var(--txt); stroke-width:2; fill:none; stroke-linecap:round}
  .topbar .tit{font-weight:750; font-size:17px; letter-spacing:-.01em; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .topbar .cuando{margin-left:auto; text-align:right; font-size:11px; color:var(--txt3); line-height:1.25; flex:none}
  .topbar .cuando b{color:var(--txt2)}
  .menu:focus-visible,.navit:focus-visible,button:focus-visible{outline:2px solid var(--acc); outline-offset:2px}

  /* ---- drawer ---- */
  .velo{position:fixed; inset:0; background:var(--velo); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:280px; max-width:82vw; z-index:41;
    background:var(--surf); border-right:1px solid var(--line);
    transform:translateX(-102%); transition:transform .22s ease;
    display:flex; flex-direction:column; padding:14px 10px calc(14px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  body.nav .velo{opacity:1; pointer-events:auto}
  body.nav .drawer{transform:none}
  .drawer h3{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--txt3); padding:12px 12px 6px}
  .navit{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:11px 12px; border-radius:10px; font-size:15px; font-weight:600; color:var(--txt);
  }
  .navit small{margin-left:auto; color:var(--txt3); font-weight:600; font-variant-numeric:tabular-nums}
  .navit.act{background:var(--acc-soft); color:var(--acc)}
  .navit .pt{width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none}
  .drawer footer{margin-top:auto; font-size:11px; color:var(--txt3); padding:14px 12px 0; line-height:1.5}

  /* ---- piezas ---- */
  .kpis{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .kpi{background:var(--surf); border:1px solid var(--line); border-radius:13px; padding:11px 13px}
  .kpi .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--txt3); font-weight:650}
  .kpi .val{font-size:24px; font-weight:750; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-top:2px}
  .kpi .sub{font-size:12px; color:var(--txt2); margin-top:1px; font-variant-numeric:tabular-nums}
  .up{color:var(--ok); font-weight:650} .down{color:var(--bad); font-weight:650}

  .banda{display:flex; gap:10px; align-items:center; background:var(--ok-bg); border-radius:13px;
    padding:11px 14px; font-size:14px; font-weight:600; color:var(--ok)}
  .banda .punto{width:9px; height:9px; border-radius:50%; background:var(--ok); flex:none}
  .banda small{display:block; font-weight:500; font-size:12px; color:var(--txt2)}

  .card{background:var(--surf); border:1px solid var(--line); border-radius:14px; padding:13px 14px}
  .card h2{font-size:14.5px; font-weight:700; letter-spacing:-.01em; margin-bottom:2px}
  .card .baj{font-size:12px; color:var(--txt3); margin-bottom:10px}
  .card svg.ch{display:block; width:100%; height:auto}
  .lectura{min-height:18px; font-size:12.5px; color:var(--txt2); margin-top:6px; font-variant-numeric:tabular-nums}

  .chips{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}
  .chip{font-size:12.5px; font-weight:650; padding:5px 12px; border-radius:99px; background:var(--surf1); color:var(--txt2)}
  .chip.act{background:var(--acc-soft); color:var(--acc)}

  .leyenda{display:flex; flex-direction:column; gap:6px; margin-top:10px}
  .leyenda .it{display:flex; align-items:center; gap:8px; font-size:13px}
  .leyenda .sw{width:11px; height:11px; border-radius:3px; flex:none}
  .leyenda .nom{color:var(--txt2); font-weight:600}
  .leyenda .v{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:650}
  .leyenda .pc{color:var(--txt3); font-variant-numeric:tabular-nums; width:48px; text-align:right}
  .ref{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:11.5px; color:var(--txt3)}
  .ref span{display:flex; align-items:center; gap:5px}
  .ref i{width:14px; border-top:2px dashed currentColor; display:inline-block}

  .hb{display:grid; grid-template-columns:96px 1fr 76px; align-items:center; gap:8px; font-size:13px; padding:3px 0}
  .hb .n{color:var(--txt2); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hb .pista{height:15px; display:flex; align-items:center}
  .hb .barra{height:13px; border-radius:0 4px 4px 0; min-width:3px; background:var(--acc)}
  .hb .v{text-align:right; font-variant-numeric:tabular-nums; font-weight:650}

  .est-cab{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .est-cab .sem{width:10px; height:10px; border-radius:50%; background:var(--ok)}
  .est-cab h1{font-size:21px; font-weight:750; letter-spacing:-.01em}
  .tag{font-size:11.5px; color:var(--txt2); background:var(--surf1); border-radius:99px; padding:4px 10px; font-weight:600}
  .volver{color:var(--acc); font-weight:650; font-size:13.5px; padding:2px 0}

  .filaP{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:6px 0; border-bottom:1px solid var(--line)}
  .filaP:last-child{border-bottom:0}
  .filaP .sw{width:10px; height:10px; border-radius:3px; flex:none}
  .filaP .nom{color:var(--txt2); font-weight:600}
  .filaP .pv{margin-left:auto; font-weight:700; font-variant-numeric:tabular-nums}
  .filaP .z{font-size:11.5px; color:var(--txt3); font-variant-numeric:tabular-nums; width:118px; text-align:right}

  /* ---- vista rapida (la maqueta aprobada) ---- */
  .tarjetas{display:flex; flex-direction:column; gap:10px}
  .est{background:var(--surf); border:1px solid var(--line); border-radius:15px; padding:13px 14px;
    display:grid; grid-template-columns:1fr 118px; gap:2px 10px; cursor:pointer; -webkit-tap-highlight-color:transparent}
  /* 1/-1 en vez de 1/3: con `1/3` la cabecera FUERZA una segunda columna
     implicita, asi que la ficha sin sparkline seguia partida en dos aunque
     .est.vacia declarara una sola. En la grilla normal significan lo mismo. */
  .est .cab{grid-column:1/-1; display:flex; align-items:center; gap:8px}
  .est .sem{width:9px; height:9px; border-radius:50%; background:var(--ok); flex:none}
  .est .nom{font-size:16px; font-weight:700}
  .est .enc{margin-left:auto; font-size:11.5px; color:var(--txt2); background:var(--surf1); border-radius:99px; padding:3px 9px; font-weight:600}
  .est .litros{font-size:23px; font-weight:750; font-variant-numeric:tabular-nums; align-self:end}
  .est .litros small{font-size:12.5px; color:var(--txt2); font-weight:600}
  .est .cmp,.est .gnc{font-size:12.5px; color:var(--txt2); font-variant-numeric:tabular-nums}
  .est .spark{grid-row:2/4; align-self:center}
  .est .spark figcaption{font-size:10px; color:var(--txt3); text-align:right; margin-top:2px}
  .est svg{display:block; width:118px; height:40px}
  .notas{background:var(--surf); border:1px solid var(--line); border-radius:13px; padding:6px 14px}
  /* La ficha sin planillas no tiene sparkline, asi que la segunda columna de
     118px la dejaba apretada contra el borde y la tarjeta medía 87px contra
     163 de las demas. Sin esa columna se acomoda sola. */
  .est.vacia{grid-template-columns:1fr}
  /* El aviso de recargar() tiene que poder salir desde CUALQUIER pantalla:
     antes solo existia en las dos de error, asi que desde el panel normal
     el boton «↻ Actualizar datos» no hacia absolutamente nada sin red. */
  /* `width:max-content` es lo que hace valer el max-width: con `left:50%` y
     sin ancho, el espacio para el shrink-to-fit es viewport/2, asi que la
     caja medía 195px en un telefono de 390 y un mensaje de una linea se
     partia en cuatro. */
  #toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(64px + env(safe-area-inset-bottom));
    width:max-content; z-index:60; max-width:min(92vw,420px); background:var(--warn-bg); color:var(--warn);
    border:1px solid var(--warn); border-radius:10px; padding:10px 14px; font-size:14px;
    font-weight:600; text-align:center; box-shadow:0 6px 24px var(--velo); display:none}
  #toast.ver{display:block}
  .nota{display:block; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; line-height:1.35}
  a.nota{color:inherit; text-decoration:none}
  a.nota:active{background:var(--acc-soft)}
  .nota:last-child{border-bottom:0}
  .nota .fu{font-size:11px; color:var(--txt3); font-weight:650; text-transform:uppercase; letter-spacing:.05em}

  /* personal del dia + calendario de francos (colores fijos del escritorio:
     son pasteles, el texto va oscuro fijo y funciona en los dos temas) */
  .pers{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 2px}
  .pers .p{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:650;
    color:#2f2f2a; border-radius:99px; padding:4px 11px}
  .pers .p small{font-weight:500; opacity:.7}
  .calwrap{overflow-x:auto; margin-top:6px; -webkit-overflow-scrolling:touch}
  table.cal{border-collapse:collapse; font-variant-numeric:tabular-nums}
  .cal th{font-size:9px; color:var(--txt3); padding:2px 1px; min-width:19px; text-align:center; border-bottom:1px solid var(--line)}
  .cal th.hoy{color:var(--acc); font-weight:800}
  .cal td{font-size:9px; text-align:center; padding:2px 1px; color:#2f2f2a; border:1px solid var(--surf)}
  .cal td.nom{font-size:11px; color:var(--txt2); text-align:left; padding-right:8px; position:sticky; left:0;
    background:var(--surf); max-width:118px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600}
  .leyfr{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .leyfr span{font-size:10.5px; color:#2f2f2a; border-radius:5px; padding:2px 7px; font-weight:650}
  .stockrow{display:grid; grid-template-columns:12px 1fr 82px 70px; align-items:center; gap:8px;
    font-size:13px; padding:6px 0; border-bottom:1px solid var(--line)}
  .stockrow:last-child{border-bottom:0}
  .stockrow .sw{width:11px; height:11px; border-radius:3px}
  .stockrow .nom{color:var(--txt2); font-weight:600}
  .stockrow .v{text-align:right; font-variant-numeric:tabular-nums; font-weight:650}
  .stockrow .aut{text-align:center; font-size:11.5px; font-weight:700; border-radius:99px; padding:3px 0}

  section h2.sec{font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--txt3); font-weight:700; margin:4px 0 8px}
  /* divisor de grupos, como los grupos Del dia / Del mes del escritorio */
  .divisor{display:flex; align-items:center; gap:10px; margin:10px 0 -2px;
    font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--txt3); font-weight:750}
  .divisor::after{content:''; flex:1; border-top:1px solid var(--line)}

  /* ---- ticker inferior ---- */
  .ticker{
    position:fixed; left:0; right:0; bottom:0; z-index:25;
    background:var(--surf); border-top:1px solid var(--line);
    height:calc(44px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
    display:flex; align-items:center; overflow:hidden;
  }
  /* padding-left == gap: el 50% de la cinta duplicada cae justo y el loop no salta */
  .ticker .cinta{display:flex; gap:34px; white-space:nowrap; padding-left:34px;
    animation:rueda 55s linear infinite; will-change:transform}
  .ticker:active .cinta{animation-play-state:paused}
  .ticker .it{font-size:13px; color:var(--txt2); font-variant-numeric:tabular-nums; display:flex; gap:7px; align-items:center}
  .ticker .it b{color:var(--txt); font-weight:700}
  .ticker .it .d{width:6px; height:6px; border-radius:50%; background:var(--acc); flex:none}
  @keyframes rueda{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){
    .ticker{overflow-x:auto}
    .ticker .cinta{animation:none}
    html{scroll-behavior:auto}
  }
</style>

<div class="topbar">
  <button class="menu" id="btnMenu" aria-label="Abrir menú" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <span class="tit" id="titVista">Panel Estaciones</span>
  <span class="cuando" id="cuando"></span>
</div>

<div class="velo" id="velo"></div>
<nav class="drawer" id="drawer" aria-label="Secciones">
  <h3>Panel</h3>
  <button class="navit" data-ruta="#general"><span>⛽ Vista general</span></button>
  <h3>Estaciones</h3>
  <div id="navEst"></div>
  <footer>
    <button class="chip act" onclick="recargar()">↻ Actualizar datos</button><br><br>
    Los datos entran solos con cada publicación de la mañana (6–8 y 10 hs).<br><br>
    Para tenerlo como app: menú del navegador → <b>Agregar a pantalla de inicio</b>.</footer>
</nav>

<main class="wrap" id="vista"></main>

<div class="ticker" aria-hidden="true"><div class="cinta" id="cinta"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---- carga desde el Gist ------------------------------------------------
   La pagina es publica y NO tiene ningun secreto: el codigo del Gist viaja
   una sola vez en el #fragmento del link compartido (el navegador nunca lo
   manda a ningun servidor), se guarda en el telefono y listo. */
const CLAVE_ID='ce_gist', CLAVE_CACHE='ce_cache';
/* En Safari en modo privado, con las cookies bloqueadas, o con la cuota llena,
   CUALQUIER acceso a localStorage tira. Y pasaba ANTES de escribir siquiera
   «Cargando los datos…», asi que la pantalla quedaba en blanco: sin un texto y
   sin un boton. Estos tres envoltorios no tiran nunca; `lsRoto` se prende para
   poder decirselo al usuario en vez de dejarlo mirando la nada. */
let lsRoto=false;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){lsRoto=true; return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v); return true;}catch(e){lsRoto=true; return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){lsRoto=true;}}
/* El id del gist es hexadecimal. La `i` esta porque el teclado del celular
   autocapitaliza, y un codigo retipeado a mano llegaba en mayusculas. */
function gistDeHash(){const m=(location.hash||'').match(/^#([0-9a-fA-F]{20,40})$/); return m?m[1].toLowerCase():null;}
function pantalla(html){document.getElementById('vista').innerHTML=html;}
function avisoId(txt){const e=document.getElementById('avisoId'); if(e)e.textContent=txt;}
/* Sin red no se puede recargar: el navegador no tiene el HTML guardado y la
   app se convierte en su pantalla de error, sin vuelta atras. Los sitios de
   recarga son CINCO, no cuatro: guardarId, olvidarId, recargar(), el refresco
   automatico, y los onclick. La primera pasada conto mal y dejo afuera
   guardarId y olvidarId — justo los dos que ademas borran cosas antes. */
function sinRed(){ return typeof navigator!=='undefined' && navigator.onLine===false; }
function avisar(txt){
  const a=document.getElementById('avisoRecarga');
  if(a){a.textContent=txt; return;}
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=txt; t.classList.add('ver');
  clearTimeout(avisar._t); avisar._t=setTimeout(()=>t.classList.remove('ver'),4000);
}
function guardarId(){
  const crudo=((document.getElementById('inId')||{}).value||'').trim();
  const v=crudo.match(/[0-9a-fA-F]{20,40}/);
  // Antes era `if(v){...}` sin else: con una entrada invalida el boton no hacia
  // absolutamente nada. Ni guardaba, ni avisaba, ni movia un pixel.
  if(!v){avisoId(crudo?'Ese código no parece válido: son entre 20 y 40 letras y números.'
                      :'Pegá el código que viene después del # en el link.'); return;}
  if(!lsSet(CLAVE_ID,v[0].toLowerCase())){
    avisoId('Este navegador no deja guardar datos. Probá sin modo privado.'); return;}
  if(sinRed()){avisoId('Guardado. Cuando tengas señal, tocá Guardar de nuevo.'); return;}
  location.reload();
}
function olvidarId(){
  // Ojo: esto borra el codigo Y la copia antes de recargar. Sin red dejaba la
  // pantalla en blanco, sin datos y sin forma de volver.
  if(sinRed()){avisar('Seguís sin señal. Probá de nuevo cuando tengas datos.'); return;}
  lsDel(CLAVE_ID); lsDel(CLAVE_CACHE); location.reload();
}
/* Sin service worker, recargar SIN RED se lleva puesta la app: el navegador
   no tiene el HTML guardado, muestra su propia pantalla de error y no hay
   vuelta atras -- ni siquiera queda el boton para reintentar. El guard estaba
   solo en el refresco automatico, y justo faltaba en los dos botones que el
   usuario toca cuando algo no anda. */
function recargar(){
  if(sinRed()){
    // El cajon NO tapa el toast (z-index 60 contra 41, medido con
    // elementFromPoint), pero dejarlo abierto sobre un aviso de «no se pudo
    // actualizar» confunde. `cerrarNav` vive dentro del closure de iniciar(),
    // asi que desde aca se cierra a mano.
    document.body.classList.remove('nav');
    const bm=document.getElementById('btnMenu');
    if(bm)bm.setAttribute('aria-expanded','false');
    avisar('Seguís sin señal. Probá de nuevo cuando tengas datos.');
    return;
  }
  location.reload();
}
async function cargar(){
  const nuevo=gistDeHash();
  if(nuevo){lsSet(CLAVE_ID,nuevo); history.replaceState(null,'','#general');}
  // Si el storage no anda, el codigo del link igual sirve para esta sesion.
  const id=nuevo||lsGet(CLAVE_ID);
  if(!id){
    pantalla('<div class="card"><h2>Falta el código</h2><div class="baj">Abrí esta página desde el '+
      'link que te compartieron (trae el código después del #). Si tenés el código a mano, pegalo acá:</div>'+
      '<input id="inId" autocomplete="off" style="width:100%;padding:10px;border:1px solid var(--line);'+
      'border-radius:10px;background:var(--surf1);color:var(--txt);font:inherit" placeholder="código">'+
      '<div id="avisoId" class="baj" style="color:var(--warn);min-height:1.2em"></div>'+
      (lsRoto?'<div class="baj" style="color:var(--warn)">Este navegador no deja guardar datos '+
              '(modo privado o cookies bloqueadas): vas a tener que pegar el código cada vez.</div>':'')+
      '<button class="chip act" style="margin-top:10px" onclick="guardarId()">Guardar</button></div>');
    return;
  }
  pantalla('<div class="card"><div class="baj">Cargando los datos…</div></div>');
  let vacio=false;
  try{
    const r=await fetch('https://gist.githubusercontent.com/IvI2511/'+id+'/raw/panel_movil.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const datos=await r.json();
    // Primero dibujar, DESPUES guardar. Al reves, un paquete nuevo con una
    // fila rota pisaba la copia buena, iniciar() tiraba, y el rescate iba a
    // buscar la copia y encontraba la que se acababa de envenenar — y la
    // borraba. El usuario se quedaba sin panel Y sin respaldo hasta que
    // alguien arreglara el JSON del otro repo.
    // Se guarda RECIEN si iniciar() dibujo un panel de verdad. Un paquete
    // vacio no tira: cae en la guarda de «no hay planillas» y vuelve normal,
    // asi que con un simple «dibujar y despues guardar» igual pisaba la copia
    // buena, y el usuario se quedaba sin el panel de ayer en la estacion.
    if(iniciar(datos)){ lsSet(CLAVE_CACHE,JSON.stringify({t:Date.now(),datos})); return; }
    // El paquete vino sin un solo dia. Si hay copia, el panel de ayer es mejor
    // que un cartel y se cae al rescate. Si NO hay copia, el rescate no hace
    // nada y abajo se respeta el cartel que iniciar() acaba de dibujar
    // («Todavia no hay planillas»), que es el diagnostico correcto: mandarlo a
    // «Revisa la senal» con la red perfecta era peor que no arreglar nada.
    vacio=true;
    throw new Error('el paquete no trae ningun dia');
  }catch(err){
    // Este es el camino del caso mas comun y esperado: quedarse sin senal en
    // la estacion. Era el unico de todo el archivo sin manejo de error atras:
    // si la copia quedo cortada (un setItem sin cuota) o viene de un formato
    // viejo, el JSON.parse o el iniciar() tiran una excepcion que nace ADENTRO
    // del catch, no la agarra nadie, y la pantalla queda en "Cargando los
    // datos..." para siempre, sin reintentar y sin avisar.
    const c=lsGet(CLAVE_CACHE);
    let restaurado=false;
    try{
    if(c){
      const {t,datos}=JSON.parse(c);
      // Si la copia tampoco trae un dia, iniciar() devuelve false y dibuja su
      // propio cartel: poner restaurado=true a ciegas colgaba encima una banda
      // que decia «Mostrando lo ultimo descargado» sobre una pantalla vacia.
      restaurado=iniciar(datos);
      // La banda solo tiene sentido si de verdad se dibujo el panel de la copia.
      // Se colgaba igual cuando la copia tampoco traia un dia: quedaba un
      // «Mostrando lo ultimo descargado» encima de «Todavia no hay planillas».
      if(restaurado){
      const av=document.createElement('div');
      av.className='banda'; av.style.background='var(--warn-bg)'; av.style.color='var(--warn)';
      av.innerHTML='<span class="punto" style="background:var(--warn)"></span><span>'+
        (vacio?'La publicación de hoy vino vacía':'Sin conexión')+
        '<small>Mostrando lo último descargado ('+new Date(t).toLocaleString('es-AR',
        {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+')</small></span>';
      document.querySelector('.wrap').prepend(av);
      }
    }
    }catch(err2){
      // La copia no sirve. Se tira, asi el proximo arranque no vuelve a
      // tropezar con la misma piedra, y se cae a la pantalla de error.
      lsDel(CLAVE_CACHE);
      // Ojo: NO se pisa `restaurado`. Si iniciar() ya dibujo el panel y lo que
      // tiro fue algo posterior (el cartel de «Sin conexion»), reemplazarlo por
      // la pantalla de error es cambiar algo que funciona por algo que no.
    }
    if(!restaurado){
      // La limpieza va SIEMPRE que no se haya restaurado, tambien cuando el
      // paquete vino vacio. Con `&& !vacio` quedaba desactivada justo en el
      // unico caso donde iniciar() corre DOS veces: la segunda corrida repone
      // el menu y la cinta y despues tira, y el usuario leia «ninguna estacion
      // cargo nada» con un menu al lado listando las seis con sus litros.
      const nv=document.getElementById('navEst'); if(nv)nv.innerHTML='';
      const ci=document.getElementById('cinta'); if(ci)ci.innerHTML='';
      const bm=document.getElementById('btnMenu'); if(bm)bm.style.display='none';
      const tk=document.querySelector('.ticker'); if(tk)tk.style.display='none';
      // Lo unico condicional es el CARTEL: si el paquete vino vacio, el que
      // dibujo iniciar() ya dice la verdad y taparlo manda a revisar una senal
      // que esta perfecta.
      if(!vacio){
      pantalla('<div class="card"><h2>No se pudo cargar</h2><div class="baj">'+
        (lsRoto?'Este navegador no deja guardar datos (modo privado o cookies bloqueadas), '+
                'así que no hay copia local para mostrar. '
              :'Revisá la señal y probá de nuevo. Si la señal está bien, puede que el código no sirva.')+
        '</div><button class="chip act" onclick="recargar()">Reintentar</button>'+
        '<button class="chip" style="margin-left:8px" onclick="olvidarId()">Usar otro código</button>'+
        '<div id="avisoRecarga" class="baj" style="color:var(--warn);min-height:1.2em"></div></div>');
      }
    }
  }
}
/* al volver a la app despues de un rato, refrescar solo */
let _oculto=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){_oculto=Date.now(); return;}
  if(!(_oculto && Date.now()-_oculto>10*60*1000))return;
  // Sin service worker, un reload sin senal se lleva puesta la app entera: el
  // navegador no tiene el HTML cacheado y muestra su propia pantalla de error.
  // Es el escenario declarado como mas comun — mirar el panel parado en la
  // estacion — asi que sin red se deja lo que ya esta en pantalla.
  // Va por sinRed() y no por una copia del predicado: este es el UNICO reload
  // que dispara solo, sin que el usuario toque nada.
  if(sinRed())return;
  // Y si esta tipeando el codigo, recargar se lo borra.
  const inp=document.getElementById('inId');
  if(inp && (inp.value||'').trim())return;
  location.reload();
});

function iniciar(DATA){

{const b=document.getElementById('btnMenu'); if(b)b.style.display='';
 const k=document.querySelector('.ticker'); if(k)k.style.display='';}
const NOTAS = DATA.notas || [];

/* ---- colores de series: los mismos del panel de escritorio ---- */

const MEDIOS = [

const fmt = new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const fmt1 = new Intl.NumberFormat('es-AR',{maximumFractionDigits:1});
const DSEM = ['dom','lun','mar','mié','jue','vie','sáb'];
const dow = f => {const [a,m,d]=f.split('-').map(Number); return new Date(a,m-1,d).getDay();};
const diaLbl = f => DSEM[dow(f)]+' '+Number(f.slice(8,10))+'/'+f.slice(5,7);
const suma = a => a.reduce((x,y)=>x+(y||0),0);
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
/* Un href sale de una fuente de afuera (el feed de noticias), asi que ademas
   de escapar la comilla se exige http(s): corta de raiz un javascript: */
const urlSegura = u => /^https?:\/\//i.test(String(u||''))
  ? String(u).replace(/&/g,'&amp;').replace(/"/g,'&quot;') : '';
/* La URL viaja en `u`. Hoy movil.py la descarta al armar el JSON (esa mitad es
   PORT-36 del lado del panel de escritorio): mientras no llegue la noticia se
   ve como texto, y el dia que llegue enlaza sola, sin tocar nada aca. */

  return href ? '<a class="nota" href="'+href+'" target="_blank" rel="noopener noreferrer">'+cuerpo+'</a>'
              : '<div class="nota">'+cuerpo+'</div>';
}

/* ---- resumen por estacion (indexado por FECHA: una rezagada no corre nada) ----
   Una estacion sin NINGUNA fila del mes SE QUEDA en la lista: es el caso
   extremo de "falta", no una estacion que no existe. Filtrarla hacia que el
   panel dijera "Sin faltantes - 5/5" siendo 6 estaciones. Todo lo que dibuja
   consulta `sinDatos` antes de ir a buscar un ultimo dia que no existe. */
const ESTS = (DATA.estaciones||[]).map(e0 => {
  // El JSON lo arma OTRO repo, que se publica por separado. Una clave que
  // falte no puede voltear el panel de las seis estaciones: sin `dias` la
  // estacion cae sola en el camino `sinDatos`, que ya existe y funciona.
  // El nombre se escapa UNA vez, aca: sale en once lugares distintos y
  // escaparlo en cada uno es una invitacion a olvidarse de uno.
  // La clave no se escapa, se RESTRINGE: ademas de ir a un atributo
  // (data-ruta) viaja al hash de navegacion, y ahi escapar no alcanza.
  // Los dias se ORDENAN: el panel toma el ultimo elemento como el mas nuevo
  // y no validaba el orden en ningun lado. Con el orden invertido inventaba
  // un «↑ 0,0%» y un «sin GNC este mes» justo debajo de 2.650 m3.
  const dias = (e0.dias||[]).slice()
    .sort((a,b)=>String(a&&a.fecha).localeCompare(String(b&&b.fecha)));
  const e = {...e0, dias, prev: e0.prev||[],
             // `nombre` va escapado porque sale en once lugares como HTML;
             // `nombreCrudo` es para los pocos que usan textContent, que NO
             // des-escapa y mostraba «Shell &amp; Cia» en la barra de arriba.
             nombre: esc(e0.nombre||''), nombreCrudo: String(e0.nombre||''),
             clave: String(e0.clave||'').replace(/[^a-z0-9_-]/gi,'')};
  const serie = e.dias.map(d=>d.liq||0);
  const ult = e.dias[e.dias.length-1]||{};
  const prom = serie.length ? suma(serie)/serie.length : 0;
  const promPrev = e.prev.length ? suma(e.prev.map(d=>d.liq))/e.prev.length : 0;
  const porFecha = {}; e.dias.forEach(d=>{porFecha[d.fecha]=d;});
  // El GNC se promedia sobre TODOS los dias cargados, no solo los que vendieron:
  // un dia con el compresor parado es un dia de venta cero, no un dia que no cuenta.
  const gncProm = serie.length ? suma(e.dias.map(d=>d.gnc||0))/serie.length : 0;
  return {...e, serie, ult, prom, promPrev, porFecha, gncProm,
    sinDatos: !e.dias.length,
    liq: ult.liq||0, gnc: ult.gnc||0, fact: ult.fact||0,
    enc: ult.encargado||'', delta: prom?((ult.liq||0)-prom)/prom*100:0,
    gncDelta: gncProm?((ult.gnc||0)-gncProm)/gncProm*100:null,
    tieneGnc: e.dias.some(d=>d.gnc)};
});
const FECHAS = [...new Set(ESTS.flatMap(e=>e.dias.map(d=>d.fecha)))].sort();
// Si NINGUNA estacion cargo un solo dia no hay fechaMax, y todo lo de abajo
// (titulos, proyeccion, graficos) sale de ahi. Se avisa y se corta.
if(!FECHAS.length){
  // Este `return` sale antes de cablear el menu, el velo y el Escape, asi que
  // la hamburguesa quedaba en pantalla sin hacer nada. En un celular un boton
  // que no responde se lee como "la app se colgo": mejor no mostrarlo.
  $('#btnMenu').style.display='none';
  // La cinta se arma al final de iniciar(), despues de este return: quedaba
  // dibujada y vacia, una franja negra al pie sin nada adentro.
  const tk=$('.ticker'); if(tk)tk.style.display='none';
  pantalla('<div class="card"><h2>Todavía no hay planillas</h2><div class="baj">'+
    (ESTS.length ? 'Ninguna de las '+ESTS.length+' estaciones cargó un día de este mes. '
                 : 'El paquete no trae ninguna estación. ')+
    'Los datos entran solos con la publicación de la mañana.</div>'+
    '<button class="chip act" onclick="recargar()">Reintentar</button>'+
    '<div id="avisoRecarga" class="baj" style="color:var(--warn);min-height:1.2em"></div></div>');
  return false;
}
const fechaMax = FECHAS[FECHAS.length-1];
ESTS.forEach(e=>{
  e.fresca = e.ult.fecha === fechaMax;
  const d = e.porFecha[fechaMax] || {};
  e.enDia = d.liq||0; e.gncDia = d.gnc||0; e.factDia = d.fact||0;
});
const frescas = ESTS.filter(e=>e.fresca);
// Los KPIs del dia suman SOLO el ultimo dia real (fechaMax): una estacion que
// no mando su planilla aporta 0 y la banda la nombra, en vez de mezclar dias.
// El promedio va SOLO sobre las que aportaron ESTE dia. El numerador suma el
// dia mas nuevo, asi que una estacion atrasada pone 0 arriba; si abajo sigue
// contando su promedio del mes, la planilla que falta se lee como caida de
// ventas. Medido sobre los fixtures: los litros decian ↓10,6% un dia en que
// las estaciones que si cargaron habian subido +8,1% — el signo al reves, en
// el numero que mas se mira del panel.
const TOT = {
  liq: suma(ESTS.map(e=>e.enDia)), gnc: suma(ESTS.map(e=>e.gncDia)),
  fact: suma(ESTS.map(e=>e.factDia)), prom: suma(frescas.map(e=>e.prom)),
  gncProm: suma(frescas.map(e=>e.gncProm))};
TOT.delta = TOT.prom ? (TOT.liq-TOT.prom)/TOT.prom*100 : 0;
// Mismo criterio que los litros: el dia contra el dia promedio de ESTE mes.
TOT.gncDelta = TOT.gncProm ? (TOT.gnc-TOT.gncProm)/TOT.gncProm*100 : null;
const MESN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
  'septiembre','octubre','noviembre','diciembre'];
const mesAct = MESN[Number(fechaMax.slice(5,7))-1];
const estPrev = ESTS.find(e=>e.prev.length);
const mesPrev = estPrev ? MESN[Number(estPrev.prev[0].fecha.slice(5,7))-1] : 'mes pasado';
const grupoDia = FECHAS.map(f=>suma(ESTS.map(e=>(e.porFecha[f]||{}).liq||0)));
const grupoPrev = (()=>{ // julio, dia a dia (hasta 31)
  // SOLO las que aportaron algo este mes. Si no, el numerador (agosto) tiene
  // cinco estaciones y el denominador (julio) tiene seis: la que no cargo nada
  // suma su julio entero y la proyeccion se da vuelta. Medido sobre los
  // fixtures: pasaba de ↑7,3% a ↓5,9%, y la linea de «media de julio» saltaba
  // de estar abajo de todas las barras a estar arriba de casi todas.
  const dias = {}; ESTS.filter(e=>!e.sinDatos).forEach(e=>e.prev.forEach(d=>{dias[d.fecha]=(dias[d.fecha]||0)+d.liq;}));
  return Object.keys(dias).sort().map(f=>({fecha:f, liq:dias[f]}));
})();
const hora = (DATA.generado||'').slice(11,16);
$('#cuando').innerHTML = 'Datos del <b>'+diaLbl(fechaMax)+'</b><br>publ. '+esc(hora)+' · '+esc(DATA.publicado_por);

/* =================== componentes de grafico (SVG) =================== */
const W=520;
function ejeY(mx){ // 3 lineas de referencia "lindas"
  const paso = Math.pow(10, Math.floor(Math.log10(mx||1)));
  let p = paso; if(mx/p>8)p*=2; if(mx/p>8)p*=2.5;
  const out=[]; for(let v=p; v<=mx; v+=p) out.push(v);
  return out.slice(0,4);
}
// Abreviar SIEMPRE con M para millones: "14.600k" se lee mal; "14,6 M" no.
const kf = v => v>=1e6 ? fmt1.format(v/1e6)+' M'
              : v>=1000 ? fmt1.format(v/1000)+' k' : fmt.format(v);

function dayBars(dias, vals, opts={}){
  const H=190, pl=34, pb=20, mx=Math.max(...vals, opts.linea2||0)*1.08;
  const bw=(W-pl-6)/vals.length;
  const y=v=>H-pb-(v/mx)*(H-pb-12);
  let g='';
  ejeY(mx).forEach(v=>{g+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/>'+
    '<text x="'+(pl-5)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="10" fill="var(--txt3)">'+kf(v)+'</text>';});
  let b='';
  vals.forEach((v,i)=>{const x=pl+i*bw+1, h=Math.max(H-pb-y(v),1);
    b+='<rect data-i="'+i+'" x="'+x+'" y="'+y(v)+'" width="'+Math.max(bw-2,2)+'" height="'+h+'" rx="3" fill="'+(opts.color||'var(--acc)')+'"/>';});
  let lx='';
  dias.forEach((f,i)=>{if(i%3===0||i===dias.length-1)lx+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9.5" fill="var(--txt3)">'+Number(f.slice(8,10))+'/'+Number(f.slice(5,7))+'</text>';});
  const prom = suma(vals)/vals.length;
  let ln='<line x1="'+pl+'" x2="'+W+'" y1="'+y(prom)+'" y2="'+y(prom)+'" stroke="'+PREV_C+'" stroke-width="2" stroke-dasharray="6 5"/>';
  if(opts.linea2) ln+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(opts.linea2)+'" y2="'+y(opts.linea2)+'" stroke="'+GNC_C+'" stroke-width="2" stroke-dasharray="2 4"/>';
  return {svg:'<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img">'+g+b+ln+lx+'</svg>', prom};
}
function lineas(seriesA, seriesB, unidad){ // acumulado este mes vs pasado (x = dia del mes)
  const H=190, pl=40, pb=20;
  const nA=seriesA.length, nB=seriesB?seriesB.length:0, nx=Math.max(nA,nB,2);
  const mx=Math.max(seriesA[nA-1]||0, nB?seriesB[nB-1]:0)*1.06;
  const x=i=>pl+i*(W-pl-8)/(nx-1), y=v=>H-pb-(v/mx)*(H-pb-12);
  let g=''; ejeY(mx).forEach(v=>{g+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/>'+
    '<text x="'+(pl-5)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="10" fill="var(--txt3)">'+kf(v)+'</text>';});
  let lx=''; [1,8,15,22,29].forEach(d=>{if(d<=nx)lx+='<text x="'+x(d-1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9.5" fill="var(--txt3)">'+d+'</text>';});
  const pth=s=>s.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  let out=g+lx;
  if(nB)out+='<path d="'+pth(seriesB)+'" fill="none" stroke="'+PREV_C+'" stroke-width="2" stroke-dasharray="5 4"/>';
  out+='<path d="'+pth(seriesA)+' L'+x(nA-1)+' '+y(0)+' L'+x(0)+' '+y(0)+' Z" fill="var(--acc-soft)" stroke="none"/>';
  out+='<path d="'+pth(seriesA)+'" fill="none" stroke="var(--acc)" stroke-width="2.4"/>';
  out+='<circle cx="'+x(nA-1)+'" cy="'+y(seriesA[nA-1])+'" r="3.6" fill="var(--acc)"/>';
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'">'+out+'</svg>';
}
function donut(items){
  const tot=suma(items.map(i=>i.v)); if(!tot)return '<p class="baj">Sin datos.</p>';
  const R=54, C=2*Math.PI*R; let off=0, arcs='';
  items.forEach(it=>{const f=it.v/tot, l=Math.max(f*C-2,0);
    arcs+='<circle r="'+R+'" cx="70" cy="70" fill="none" stroke="'+it.c+'" stroke-width="26" '+
      'stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';
    off+=f*C;});
  const ley=items.map(it=>'<div class="it"><span class="sw" style="background:'+it.c+'"></span>'+
    '<span class="nom">'+it.l+'</span><span class="v">'+fmt.format(it.v)+(it.u?' '+it.u:' L')+'</span>'+
    '<span class="pc">'+(it.v/tot*100).toFixed(1).replace('.',',')+'%</span></div>').join('');
  return '<div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap">'+
    '<svg width="132" height="132" viewBox="0 0 140 140" style="flex:none">'+arcs+'</svg>'+
    '<div class="leyenda" style="flex:1; min-width:190px">'+ley+'</div></div>';
}
function hbars(items, unidad, colores){
  const mx=Math.max(...items.map(i=>i.v));
  return items.map(it=>'<div class="hb"><span class="n">'+it.l+'</span>'+
    '<span class="pista"><span class="barra" style="width:'+(it.v/mx*100).toFixed(1)+'%; '+
    (colores?'background:'+it.c:'')+'"></span></span>'+
    '<span class="v">'+(unidad==='$'?'$ ':'')+kf(it.v)+(unidad&&unidad!=='$'?' '+unidad:'')+'</span></div>').join('');
}
function spark(serie){
  const W2=118,H=40,p=4, mn=Math.min(...serie), mx=Math.max(...serie);
  const x=i=>p+i*(W2-2*p)/Math.max(serie.length-1,1);
  const y=v=>mx===mn?H/2:H-p-(v-mn)*(H-2*p)/(mx-mn);
  const pts=serie.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1));
  const ux=x(serie.length-1).toFixed(1), uy=y(serie[serie.length-1]).toFixed(1);
  return '<svg viewBox="0 0 '+W2+' '+H+'" aria-hidden="true">'+
    '<polygon points="'+p+','+(H-p)+' '+pts.join(' ')+' '+ux+','+(H-p)+'" fill="var(--acc-soft)"/>'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--acc)" stroke-width="2"/>'+
    '<circle cx="'+ux+'" cy="'+uy+'" r="3.2" fill="var(--acc)"/></svg>';
}
const deltaTxt = d => '<span class="'+(d>=0?'up':'down')+'">'+(d>=0?'↑':'↓')+' '+
  Math.abs(d).toFixed(1).replace('.',',')+'%</span> vs prom. del mes';
/* El GNC se compara igual que los litros: el dia contra el dia promedio del
   mes. Antes decia "N estaciones con GNC" (redundante) y, en el panel de una
   estacion, "no vende GNC" — una afirmacion que el panel no puede sostener:
   el JSON no dice quien TIENE surtidor de GNC, solo cuanto vendio cada dia.
   Un mes entero sin GNC puede ser una estacion que no lo tiene o un compresor
   parado, y el panel no distingue. Asi que informa lo que sabe. */
const gncSub = d => d==null ? 'sin GNC este mes' : deltaTxt(d);

/* lectura al tocar una barra */
function tocable(cardEl, dias, vals, unidad){
  const svg=cardEl.querySelector('svg'); const out=cardEl.querySelector('.lectura');
  if(!svg||!out)return;
  svg.addEventListener('click', ev=>{
    const r=ev.target.closest('rect[data-i]'); if(!r)return;
    const i=+r.dataset.i;
    out.textContent = diaLbl(dias[i])+' · '+fmt.format(vals[i])+' '+unidad;
  });
}

/* =================== vistas =================== */
function sumaCampo(dias,k){return suma(dias.map(d=>d[k]||0));}

/* ---- helpers de las secciones nuevas ---- */
const DIAS_MES = new Date(+fechaMax.slice(0,4), +fechaMax.slice(5,7), 0).getDate();
const flecha = d => '<span class="'+(d>=0?'up':'down')+'">'+(d>=0?'↑':'↓')+' '+
  Math.abs(d).toFixed(1).replace('.',',')+'%</span>';
const FR_COLOR={P:'#CFE4F7',MM:'#FFE2AD','T*':'#F2A65E',TN:'#8EA9DB',CT:'#CBA6E3',
  'M*':'#7FC9BE',F:'#B9E6C4',V:'#E3C6F2',L:'#D9D9D9',FA:'#D96C6C',B:'#A9AFB8'};
function frColor(c){
  if(FR_COLOR[c])return FR_COLOR[c];
  if(c&&c[0]==='T')return FR_COLOR['T*'];
  if(c&&c[0]==='M')return FR_COLOR['M*'];
  return '#E4E4E0';
}
function porDowDe(fechas, vals){
  return [1,2,3,4,5,6,0].map(dw=>{
    const vs=fechas.map((f,i)=>dow(f)===dw?vals[i]:null).filter(v=>v!=null&&v>0);
    return {l:DSEM[dw], v: vs.length?Math.round(suma(vs)/vs.length):0};});
}
function fichaEst(e){
  // Sin una sola fila del mes no hay ultimo dia, ni sparkline, ni delta: la
  // ficha dice eso mismo en vez de desaparecer o inventar ceros.
  if(e.sinDatos)
    return '<div class="est vacia" tabindex="0" role="button" data-ruta="#est/'+e.clave+'">'+
      '<div class="cab"><span class="sem" style="background:var(--warn)"></span>'+
      '<span class="nom">'+e.nombre+'</span></div>'+
      '<div class="litros" style="color:var(--txt3)">—</div>'+
      '<div class="cmp" style="color:var(--warn)">Sin planillas este mes</div></div>';
  return '<div class="est" tabindex="0" role="button" data-ruta="#est/'+e.clave+'">'+
    '<div class="cab"><span class="sem"></span><span class="nom">'+e.nombre+'</span><span class="enc">'+esc(e.enc)+'</span></div>'+
    '<div class="litros">'+fmt.format(e.liq)+' <small>L · '+diaLbl(e.ult.fecha)+'</small></div>'+
    '<figure class="spark">'+spark(e.serie)+'<figcaption>Litros por día · '+mesAct+'</figcaption></figure>'+
    '<div class="cmp">'+deltaTxt(e.delta)+'</div>'+
    '<div class="gnc">'+(e.gnc ? 'GNC '+fmt.format(e.gnc)+' m³'
      : e.tieneGnc ? 'GNC 0 m³ ese día' : 'Sin GNC este mes')+'</div></div>';
}
function proyCard(acum, nCon, prevTot, quien){
  if(!nCon)return '';
  const proy = acum/nCon*DIAS_MES;
  const d = prevTot ? (proy-prevTot)/prevTot*100 : null;
  return '<div class="card"><h2>Proyección de cierre</h2>'+
    '<div class="baj">'+quien+' · a este ritmo</div>'+
    '<div class="kpis" style="margin-top:2px">'+
    '<div class="kpi" style="border:0;padding:0"><div class="lbl">Proyección '+mesAct+'</div>'+
    '<div class="val">'+kf(Math.round(proy))+' L</div>'+
    (d==null?'':'<div class="sub">'+flecha(d)+' vs '+mesPrev+'</div>')+'</div>'+
    '<div class="kpi" style="border:0;padding:0"><div class="lbl">Cerró '+mesPrev+'</div>'+
    '<div class="val">'+(prevTot?kf(prevTot)+' L':'s/d')+'</div>'+
    '<div class="sub">'+nCon+' de '+DIAS_MES+' días cargados</div></div></div></div>';
}

  const medios = MEDIOS.map(m=>({l:m.l,c:m.c,v:sumaCampo(dias,m.k)})).filter(m=>m.v>0);

  // Stock y autonomia: varillas por tanque + capacidad por producto + ritmo

    <div class="kpi"><div class="lbl">Litros · ${diaLbl(e.ult.fecha)}</div><div class="val">${fmt.format(e.liq)} L</div>
      <div class="sub">${deltaTxt(e.delta)}</div></div>
    <div class="kpi"><div class="lbl">GNC · ${diaLbl(e.ult.fecha)}</div><div class="val">${e.gnc?fmt.format(e.gnc)+' m³':'—'}</div>
      <div class="sub">${gncSub(e.gncDelta)}</div></div>
    <div class="kpi"><div class="lbl">Cobrado digital</div><div class="val">$ ${kf(e.fact)}</div>
      <div class="sub">MP + tarjetas + SB + red.</div></div>
    <div class="kpi"><div class="lbl">Prom. del mes</div><div class="val">${fmt.format(Math.round(e.prom))} L</div>
      <div class="sub">${mesPrev}: ${e.promPrev?fmt.format(Math.round(e.promPrev))+' L/día':'s/d'}</div></div>
  </div>

  <div class="card" id="eComb"><h2>Combustibles</h2>
    <div class="chips"><button class="chip act" data-m="dia">El día</button><button class="chip" data-m="mes">El mes</button></div>
    <div class="cdonut">${donut(diaProd)}</div></div>

  ${personalHtml}

  ${stockHtml}

  ${tanquesHtml}

  <div class="divisor">Del mes</div>

  ${proyCard(suma(e.serie), e.serie.filter(v=>v>0).length, Math.round(suma(e.prev.map(d=>d.liq))), e.nombre)}

  <div class="card" id="eVentas"><h2>Ventas diarias</h2><div class="baj">Litros líquidos por día · ${mesAct}</div>
    <div class="cch"></div>
    <div class="ref"><span style="color:${PREV_C}"><i></i> media del mes</span>
      ${e.promPrev?'<span style="color:'+GNC_C+'"><i></i> media de '+mesPrev+'</span>':''}</div>
    <div class="lectura">Tocá una barra para ver el día.</div></div>

  ${mixHtml}

  <div class="card"><h2>Por día de la semana</h2><div class="baj">Promedio de litros · ${mesAct}</div>
    ${hbars(porDowE,'L')}</div>

  <div class="card"><h2>Medios de pago del mes</h2><div class="baj">${e.nombre} · ${mesAct}</div>
    ${medios.length?hbars(medios,'$',true):'<p class="baj">La planilla no trae el desglose.</p>'}</div>

  ${camionesHtml}

  ${aceiteMes?'<div class="card"><h2>Aceite</h2><div class="baj">Venta del mes</div><div class="kpi" style="border:0;padding:0"><div class="val">'+fmt1.format(aceiteMes)+' L</div></div></div>':''}

  <div class="card"><h2>Acumulado vs. ${mesPrev}</h2><div class="baj">Litros acumulados por día del mes</div>
    ${lineas(acumA, acumB.length?acumB:null)}
    <div class="ref"><span style="color:var(--acc)"><i style="border-top-style:solid"></i> ${mesAct}</span>
      ${acumB.length?'<span style="color:'+PREV_C+'"><i></i> '+mesPrev+'</span>':''}</div></div>

  ${obsHtml}

  ${calHtml}`;
  $('#vista').innerHTML = html;
  const ev=$('#eVentas'); const db=dayBars(fech, e.serie, {linea2:e.promPrev||0});
  ev.querySelector('.cch').innerHTML=db.svg;
  tocable(ev, fech, e.serie, 'L');
  $('#eComb').addEventListener('click', evn=>{
    const c=evn.target.closest('.chip'); if(!c)return;
    document.querySelectorAll('#eComb .chip').forEach(x=>x.classList.toggle('act',x===c));
    $('#eComb .cdonut').innerHTML = donut(c.dataset.m==='dia'?diaProd:mesProd);
  });
}

/* =================== navegacion =================== */
function render(){
  const h=location.hash||'#general';
  window.scrollTo(0,0);
  if(h.startsWith('#est/')){const cl=h.slice(5); vEstacion(cl);
    const e=ESTS.find(x=>x.clave===cl); $('#titVista').textContent=e?e.nombreCrudo:'Panel Estaciones';}
  else {vGeneral(); $('#titVista').textContent='Panel Estaciones';}
  document.querySelectorAll('.navit').forEach(b=>b.classList.toggle('act',b.dataset.ruta===h));
  cerrarNav();
}
function abrirNav(){document.body.classList.add('nav');$('#btnMenu').setAttribute('aria-expanded','true');}
function cerrarNav(){document.body.classList.remove('nav');$('#btnMenu').setAttribute('aria-expanded','false');}
$('#btnMenu').addEventListener('click',()=>document.body.classList.contains('nav')?cerrarNav():abrirNav());
$('#velo').addEventListener('click',cerrarNav);
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarNav();});
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-ruta]'); if(!r)return;
  location.hash=r.dataset.ruta;
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.ruta){e.preventDefault();location.hash=e.target.dataset.ruta;}
});
window.addEventListener('hashchange',render);

$('#navEst').innerHTML = ESTS.map(e=>
  '<button class="navit" data-ruta="#est/'+e.clave+'"><span class="pt"'+
  // El punto es verde fijo por CSS: la que no cargo nada quedaba marcada como
  // al dia justo en el menu, mientras la banda y la ficha la daban por faltante.
  (e.sinDatos?' style="background:var(--warn)"':'')+'></span><span>'+e.nombre+'</span><small>'+
  (e.sinDatos?'sin planillas':kf(e.liq)+' L')+'</small></button>').join('');

/* ticker inferior */
const tk=[ '<b>'+fmt.format(TOT.liq)+' L</b> el '+diaLbl(fechaMax)+' en el grupo ('+(TOT.delta>=0?'+':'−')+Math.abs(TOT.delta).toFixed(1).replace('.',',')+'%)',
  'GNC <b>'+fmt.format(TOT.gnc)+' m³</b>',
  frescas.length===ESTS.length
    ? 'Sin faltantes · '+ESTS.length+'/'+ESTS.length+' planillas'
    : 'FALTAN: '+ESTS.filter(e=>!e.fresca).map(e=>e.nombre).join(', '), ]
  // El top 3 sale del ULTIMO dia de cada estacion, que no siempre es el dia
  // del resto del panel: una atrasada entraba mezclada con las de hoy y sin
  // ninguna fecha. Ahora la que no esta al dia se muestra fechada, y la que no
  // cargo nada no compite.
  .concat(ESTS.filter(e=>!e.sinDatos).sort((a,b)=>b.delta-a.delta).slice(0,3)
    .map(e=>e.nombre+' <b>'+fmt.format(e.liq)+' L</b> ('+(e.delta>=0?'+':'−')+
      Math.abs(e.delta).toFixed(1).replace('.',',')+'%'+(e.fresca?'':' · '+diaLbl(e.ult.fecha))+')'))
  .concat(NOTAS.slice(0,3).map(n=>esc(n.fu)+': '+esc(n.t)));
const cinta = tk.map(t=>'<span class="it"><span class="d"></span><span>'+t+'</span></span>').join('');
$('#cinta').innerHTML = cinta + cinta;   /* duplicada para el loop continuo */

render();
return true;
}
cargar();
</script>
